<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mysee</title>
<style>
  :root {
    --bg: #0a0c0f; --panel: #11151a; --line: #1e252e; --text: #d6dde6;
    --dim: #7a8594; --rec: #e5484d; --ok: #3fb950; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12px/1.3 ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 16px; height: 36px; padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; letter-spacing: .2em; }
  .brand b { color: var(--rec); }
  .grow { flex: 1; }
  .meta { color: var(--dim); }
  #grid { display: grid; gap: 3px; padding: 3px; height: calc(100vh - 36px); }
  .tile { position: relative; background: #000; overflow: hidden; cursor: zoom-in;
    outline: 1px solid var(--line); min-height: 0; }
  .tile img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .ov { position: absolute; padding: 3px 7px; background: rgba(0,0,0,.55);
    text-shadow: 0 1px 1px #000; white-space: nowrap; pointer-events: none; }
  .tl { top: 6px; left: 6px; } .tr { top: 6px; right: 6px; }
  .bl { bottom: 6px; left: 6px; color: var(--dim); } .br { bottom: 6px; right: 6px; }
  .ch { color: var(--warn); font-weight: 700; margin-right: 6px; }
  .live { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--rec);
    animation: blink 1.2s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .tile.down .live i { background: var(--dim); animation: none; }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 6px; color: var(--dim); letter-spacing: .15em;
    background: repeating-linear-gradient(0deg, #0d0f12 0 2px, #07080a 2px 4px); }
  .msg small { letter-spacing: 0; max-width: 90%; text-align: center; }
  .tile.ok .msg { display: none; }
  #grid.solo .tile:not(.focus) { display: none; }
  #grid.solo { grid-template-columns: 1fr !important; grid-template-rows: 1fr !important; }
  #grid.solo .tile { cursor: zoom-out; }
  .empty { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center;
    color: var(--dim); letter-spacing: .15em; }
  @media (max-width: 700px) {
    #grid { height: auto; grid-template-columns: 1fr !important; grid-template-rows: none !important; }
    .tile { aspect-ratio: 4 / 3; }
    .meta.hide-sm { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">MY<b>SEE</b></div>
  <div class="meta" id="host"></div>
  <div class="grow"></div>
  <div class="meta hide-sm" id="count"></div>
  <div id="clock"></div>
</header>
<main id="grid"></main>

<script>
const grid = document.getElementById('grid');
let ids = '';

const pad = n => String(n).padStart(2, '0');
function now() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
         `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function layout(n) {
  const cols = Math.max(1, Math.ceil(Math.sqrt(n)));
  const rows = Math.max(1, Math.ceil(n / cols));
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

function tile(cam, i) {
  const t = document.createElement('div');
  t.className = 'tile';
  t.dataset.id = cam.id;
  t.innerHTML = `
    <img alt="">
    <div class="msg"><span>CONNESSIONE…</span><small></small></div>
    <div class="ov tl"><span class="ch">CAM ${pad(i + 1)}</span><span class="name"></span></div>
    <div class="ov tr"><span class="live"><i></i>LIVE</span></div>
    <div class="ov bl info"></div>
    <div class="ov br clock"></div>`;
  t.querySelector('.name').textContent = cam.name;
  const img = t.querySelector('img');
  const connect = () => {
    t.classList.remove('down');
    img.src = `/stream/${encodeURIComponent(cam.id)}?t=${Date.now()}`;
  };
  img.onerror = () => {
    t.classList.remove('ok'); t.classList.add('down');
    t.querySelector('.msg span').textContent = 'SEGNALE ASSENTE';
    setTimeout(connect, 3000);
  };
  t.onclick = () => {
    const solo = grid.classList.toggle('solo');
    document.querySelectorAll('.tile.focus').forEach(x => x.classList.remove('focus'));
    if (solo) t.classList.add('focus');
  };
  connect();
  return t;
}

function update(cams) {
  for (const cam of cams) {
    const t = grid.querySelector(`.tile[data-id="${CSS.escape(cam.id)}"]`);
    if (!t) continue;
    t.querySelector('.info').textContent =
      `${cam.device} · ${cam.width}×${cam.height}` + (cam.fps ? ` · ${cam.fps} fps` : '');
    t.querySelector('.msg small').textContent = cam.error || '';
  }
}

async function refresh() {
  let data;
  try {
    data = await (await fetch('/api/cameras', { cache: 'no-store' })).json();
  } catch (e) {
    document.getElementById('count').textContent = 'server non raggiungibile';
    return;
  }
  const cams = data.cameras;
  document.getElementById('host').textContent = data.host;
  document.title = `mysee · ${data.host}`;
  document.getElementById('count').textContent =
    `${cams.length} telecamer${cams.length === 1 ? 'a' : 'e'}`;
  const newIds = cams.map(c => c.id).join(',');
  if (newIds !== ids) {
    ids = newIds;
    grid.classList.remove('solo');
    grid.querySelectorAll('img').forEach(img => { img.onerror = null; img.src = ''; });
    grid.replaceChildren(...cams.map(tile));
    if (!cams.length) grid.innerHTML = '<div class="empty">NESSUNA TELECAMERA TROVATA</div>';
    layout(cams.length);
  }
  update(cams);
}

setInterval(() => {
  const s = now();
  document.getElementById('clock').textContent = s;
  grid.querySelectorAll('.tile').forEach(t => {
    t.querySelector('.clock').textContent = s;
    const img = t.querySelector('img');
    if (img.naturalWidth > 0 && !t.classList.contains('down')) t.classList.add('ok');
  });
}, 1000);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { grid.classList.remove('solo'); }
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
